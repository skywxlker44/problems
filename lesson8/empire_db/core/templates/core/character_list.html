<!DOCTYPE html>
<html>
<head>
    <title>All Characters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
            background: black;
            color: #fff;
        }

        /* Animated stars */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
            100% { opacity: 0.1; transform: scale(1); }
        }

        .container {
            background-color: rgba(0, 0, 30, 0.85);
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
        }

        h1 {
            color: #FFD700;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
        }

        .card {
            background-color: rgba(10, 10, 50, 0.85);
            border: 2px solid #FFD700;
            border-radius: 15px;
            box-shadow: 0 0 20px #FFD700;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #FFD700, 0 0 60px #FFD700;
        }

        .card-title {
            color: #FFD700;
            text-shadow: 0 0 8px #FFD700;
        }

        .card-text {
            color: #FFFACD;
        }

        .btn-primary {
            background-color: #1E3A8A;
            border-color: #FFD700;
            box-shadow: 0 0 10px #FFD700;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #3749AB;
            box-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h1>All Characters</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for character in characters %}
        <div class="col">
            <div class="card h-100 shadow">
                <div class="card-body">
                    <h5 class="card-title">{{ character.name }}</h5>
                    <p class="card-text">Gender: {{ character.gender }}<br>Birth Year: {{ character.birth_year }}</p>
                    <a href="{% url 'character_detail' character.id %}" class="btn btn-primary">Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    const starsCount = 100;
    for (let i=0; i<starsCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.top = Math.random() * window.innerHeight + 'px';
        star.style.left = Math.random() * window.innerWidth + 'px';
        star.style.width = star.style.height = (Math.random()*3 + 1) + 'px';
        document.body.appendChild(star);
    }
</script>
</body>
</html>
